<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>Form registration</title></head>
  <body>
    <!-- Netlify Forms build-time registration only. Field names must match the React forms. -->
    <form name="home-collection" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="home-collection" />
      <input name="name" />
      <input name="mobile" />
      <input name="email" />
      <textarea name="address"></textarea>
      <input name="city" />
      <input name="state" />
      <input name="pin" />
      <input name="other-tests" />
      <input name="date" />
      <input name="time" />
      <textarea name="instructions"></textarea>
      <input name="consent" />
      <input name="reference" />
      <input name="request-type" />
      <input name="tests" />
      <input name="status" />
      <input name="collection-fee" />
      <input name="bot-field" />
    </form>
    <form name="test-booking" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="test-booking" />
      <input name="collection" />
      <input name="name" />
      <input name="mobile" />
      <input name="email" />
      <input name="age" />
      <input name="gender" />
      <textarea name="address"></textarea>
      <input name="city" />
      <input name="pin" />
      <input name="date" />
      <input name="time" />
      <textarea name="instructions"></textarea>
      <input name="consent" />
      <input name="reference" />
      <input name="method" />
      <input name="tests" />
      <input name="estimated-total" />
      <input name="serviceable" />
      <input name="status" />
      <input name="bot-field" />
    </form>
    <form name="partnership-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="partnership-enquiry" />
      <input name="organization" />
      <input name="contact-name" />
      <input name="role" />
      <input name="mobile" />
      <input name="email" />
      <input name="city" />
      <input name="partnership-type" />
      <textarea name="details"></textarea>
      <input name="reference" />
      <input name="status" />
      <input name="bot-field" />
    </form>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="mobile" />
      <input name="email" />
      <input name="topic" />
      <textarea name="message"></textarea>
      <input name="reference" />
      <input name="status" />
      <input name="bot-field" />
    </form>
  </body>
</html>
